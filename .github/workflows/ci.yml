name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff (lint)
        run: ruff check . || true   # advisory for now; tighten once the tree is clean
      - name: Byte-compile all modules
        run: python -m compileall -q .

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # Blocking: the only known literal (the dev API-key fallback) is allowlisted
    # in .gitleaks.toml, so any *new* secret fails the build.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Use the gitleaks binary rather than the Action: the Action requires a
      # paid license for organization repos, the binary is free and equivalent.
      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan git history for secrets
        run: gitleaks detect --source . --redact --no-banner

  smoke:
    name: Pipeline smoke test (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('model_registry.py') }}
      - name: Install CPU torch (keep CI off CUDA wheels)
        run: |
          pip install --upgrade pip
          pip install torch==2.13.0 torchvision==0.28.0 torchaudio==2.11.0 \
            --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Run end-to-end smoke test
        env:
          HF_HOME: ~/.cache/huggingface
        run: python scripts/smoke_test.py
